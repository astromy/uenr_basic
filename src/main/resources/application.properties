# ---------------------------------------------------------------------------
# Paystack (fee payments)
# ---------------------------------------------------------------------------
# NEVER put real keys directly in this file. Set these as environment variables
# on the deployment host / container / hosting platform instead:
#   PAYSTACK_SECRET_KEY   sk_live_xxx  (or sk_test_xxx while testing)
#   PAYSTACK_PUBLIC_KEY   pk_live_xxx  (or pk_test_xxx while testing)
#   PAYSTACK_CALLBACK_URL https://your-school-domain.com/Paystack/callback
# Also set the webhook URL in the Paystack dashboard (Settings > API Keys & Webhooks) to:
#   https://your-school-domain.com/Paystack/webhook
paystack.secret-key=${PAYSTACK_SECRET_KEY:}
paystack.public-key=${PAYSTACK_PUBLIC_KEY:}
paystack.callback-url=${PAYSTACK_CALLBACK_URL:https://4581-156-0-145-93.ngrok-free.app/Paystack/callback}
paystack.base-url=${PAYSTACK_BASE_URL:https://api.paystack.co}
paystack.currency=${PAYSTACK_CURRENCY:GHS}
paystack.pass-fees-to-customer=${PAYSTACK_PASS_FEES:true}
paystack.fee-percent=${PAYSTACK_FEE_PERCENT:1.95}

# Enable Spring Scheduling for automatic daily billing
spring.task.scheduling.pool.size=2

# Billing Scheduler Configuration
# Cron expression for daily billing (default: runs at midnight every day)
# Format: second minute hour day-of-month month day-of-week
# Example: "0 0 0 * * ?" = every day at midnight
# Example: "0 0 8 * * MON-FRI" = weekdays at 8:00 AM
#billing.scheduler.cron=0 0 0 * * ?
billing.scheduler.cron=0 25 3 ? * MON-SAT
# Weekly Course Notification Scheduler Configuration
# Cron expression for weekly course notifications (default: runs every Monday at 8:00 AM)
# Format: second minute hour day-of-month month day-of-week
# Example: "0 0 8 ? * MON" = every Monday at 8:00 AM
#notification.weekly.course.cron=0 0 8 ? * MON
notification.weekly.course.cron=0 25 3 ? * MON-SAT
# Activity Log Configuration
# Number of days to retain activity logs before automatic deletion
activity.log.retention.days=1
<div th:fragment="defaulter">
<div class="jumbotron bg-white" > 
      <div class="col-2">  
            <a class="btn btn-secondary" id="button"  
               th:onclick="printData();">PRINT&nbsp;<span class="fa fa-print"></span></a>   
        </div>
<table class="table table-info " id="mydata">
                  <Label>Defaulters</label>
                  <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>Class</th>
                        <th>Amount Paid(GHC)</th>
                        <th>Balance(GHC)</th>
                     </tr>
                </thead>
    
                <tbody>
                     <tr th:each="p:${defaulters}">
                         <td><span th:text="${p.Student.surname}"/>
                         <span th:text="${p.Student.LastName}"/>
                         <span th:text="${p.Student.FirstName}"/>
                          </td>
                          <td th:text="${p.Student.studentklass.ClassName}"></td>
                          <td th:text="${p.Amount}"></td>
                         <td th:text="${p.Remaining}"></td> 
                          
                        </tr>
                    <tr class="bg-info text-white">
                        <td>Total Amount Owing: (GHC)<span th:text="${Amout_not_Paid}"></span></td>
                        <td><span></span></td>
                        <td><span></span></td>
                        <td><span></span></td>
                     </tr>
                
                </tbody>
              </table>
             </div>
    <script>

            function printData() {
                document.getElementById("button").classList.add("d-none");
                //document.getElementById("home").classList.add("d-none");

                window.print();
                document.getElementById("button").classList.remove("d-none");
                document.getElementById("home").classList.remove("d-none");

            }
        </script>
    </div>

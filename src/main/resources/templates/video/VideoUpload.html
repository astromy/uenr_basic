    <script>
        function loadVideo (id){
             $("#Videoplay").modal("show");

           
        var tag=document.createElement('script');
        tag.src="https://www.youtube.com/player_api";
        var control =document.getElementsByTagName("script")[0];
        control.parentNode.insertBefore(tag,control);
        //https://www.youtube.com/watch?v=3Rgc-dTAO6k
        var player;
       onYouTubePlayerApiReady (player,id);
       
        
    }
    function onYouTubePlayerApiReady (player,id){
    
        player = new YT.Player('videoPlayer',{
            height:'360px',
            width:'640px',
            videoId:id
        });
        
        
    }

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Pay School Fees</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/bootstrap.min.css}" th:rel="stylesheet">
    <link th:href="@{/css/fontawesome.css}" rel="stylesheet" type="text/css"/>
    <style>
        body { background:#f4f6f9; font-family:'Inter', sans-serif; }
        .pay-card { max-width:460px; margin:60px auto; }
        .pay-card .card-header { background:#0d6efd; color:#fff; }
    </style>
</head>
<body>
<div class="pay-card">
    <div class="card shadow-sm border-0">
        <div class="card-header text-center py-3">
            <h4 class="mb-0">Pay School Fees</h4>
            <small>Secure payment powered by Paystack</small>
        </div>
        <div class="card-body p-4">

            <div th:if="${msg}" class="alert alert-warning" th:text="${msg}"></div>

            <div th:if="${student}">
                <table class="table table-sm mb-4">
                    <tr>
                        <td>Student ID</td>
                        <td th:text="${studentId}"></td>
                    </tr>
                    <tr>
                        <td>Name</td>
                        <td th:text="${student.fullName}"></td>
                    </tr>
                    <tr th:if="${outstandingBalance != null}">
                        <td>Outstanding Balance</td>
                        <td>GHS <span th:text="${#numbers.formatDecimal(outstandingBalance,1,2)}"></span></td>
                    </tr>
                </table>

                <form th:if="${paystackConfigured == null or paystackConfigured}"
                      th:method="post" th:action="@{/Paystack/Initiate}">
                    <input type="hidden" name="studentId" th:value="${studentId}"/>

                    <div class="form-group mb-3">
                        <label for="amount">Amount to pay (GHS)</label>
                        <input type="number" step="0.01" min="1" class="form-control"
                               id="amount" name="amount" placeholder="e.g. 500.00" required>
                    </div>

                    <div th:if="${passFees}" id="fee_box" class="alert alert-light border small mb-3 d-none">
                        <div class="d-flex justify-content-between"><span>School fees</span><span>GHS <span id="fee_net">0.00</span></span></div>
                        <div class="d-flex justify-content-between"><span>Paystack charge (<span th:text="${feePercent}"></span>%)</span><span>GHS <span id="fee_charge">0.00</span></span></div>
                        <hr class="my-1">
                        <div class="d-flex justify-content-between fw-bold"><span>Total you will pay</span><span>GHS <span id="fee_total">0.00</span></span></div>
                    </div>

                    <div class="form-group mb-3">
                        <label for="email">Email (for your payment receipt)</label>
                        <input type="email" class="form-control" id="email" name="email"
                               th:value="${student.email}" placeholder="you@example.com">
                    </div>

                    <input type="hidden" name="paymentType" value="SchoolFees"/>

                    <button type="submit" class="btn btn-primary w-100" id="pay_btn" onclick="spinOnload()">
                        Proceed to Pay
                    </button>
                    <button class="btn btn-primary w-100 d-none" id="loading_btn" type="button">
                        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                        Redirecting to Paystack...
                    </button>
                </form>

                <div th:if="${paystackConfigured != null and !paystackConfigured}" class="alert alert-danger mt-3">
                    Online payment is temporarily unavailable. Please contact the school office.
                </div>
            </div>

        </div>
    </div>
</div>

<script th:inline="javascript">
    var passFees = /*[[${passFees}]]*/ false;
    var feeRate = (/*[[${feePercent}]]*/ 0) / 100;
    var amountInput = document.getElementById('amount');
    if (passFees && amountInput) {
        amountInput.addEventListener('input', function () {
            var box = document.getElementById('fee_box');
            var netP = Math.round(parseFloat(amountInput.value) * 100);
            if (!netP || netP <= 0) { box.classList.add('d-none'); return; }
            // Same formula as PaystackService.calculateChargePesewas: fee = amount x rate
            var totalP = netP + Math.round(netP * feeRate);
            document.getElementById('fee_net').textContent = (netP / 100).toFixed(2);
            document.getElementById('fee_charge').textContent = ((totalP - netP) / 100).toFixed(2);
            document.getElementById('fee_total').textContent = (totalP / 100).toFixed(2);
            box.classList.remove('d-none');
        });
    }

    function spinOnload() {
        document.getElementById('pay_btn').classList.add('d-none');
        document.getElementById('loading_btn').classList.remove('d-none');
    }
</script>
</body>
</html>

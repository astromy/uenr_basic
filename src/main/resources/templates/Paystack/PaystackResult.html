<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Payment Result</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/bootstrap.min.css}" th:rel="stylesheet">
    <link th:href="@{/css/fontawesome.css}" rel="stylesheet" type="text/css"/>
    <style>
        body { background:#f4f6f9; font-family:'Inter', sans-serif; }
        .result-card { max-width:460px; margin:60px auto; }
    </style>
</head>
<body>
<div class="result-card">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4 text-center">

            <div th:if="${success}">
                <i class="fa fa-check-circle text-success" style="font-size:48px;"></i>
                <h4 class="mt-3">Payment Successful</h4>
                <table class="table table-sm mt-3 text-start">
                    <tr><td>Student</td><td th:text="${student != null ? student.fullName : studentId}"></td></tr>
                    <tr><td>Amount Credited</td><td>GHS <span th:text="${#numbers.formatDecimal(amount,1,2)}"></span></td></tr>
                    <tr th:if="${totalCharged != null and totalCharged > amount}"><td>Total Charged (incl. Paystack fee)</td><td>GHS <span th:text="${#numbers.formatDecimal(totalCharged,1,2)}"></span></td></tr>
                    <tr><td>Reference</td><td th:text="${reference}"></td></tr>
                    <tr th:if="${outstandingBalance != null}">
                        <td>New Outstanding Balance</td>
                        <td>GHS <span th:text="${#numbers.formatDecimal(outstandingBalance,1,2)}"></span></td>
                    </tr>
                </table>
                <p class="text-muted small">A confirmation SMS has been sent to the registered parent number.</p>
            </div>

            <div th:unless="${success}">
                <i class="fa fa-times-circle text-danger" style="font-size:48px;"></i>
                <h4 class="mt-3">Payment Not Confirmed</h4>
                <p th:text="${msg}"></p>
                <p class="text-muted small" th:if="${reference}">Reference: <span th:text="${reference}"></span></p>
            </div>

            <a th:href="@{/login}" class="btn btn-outline-primary mt-3">Return to School Portal</a>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecting to Paystack…</title>
    <!-- Fallback if JavaScript is disabled -->
    <meta http-equiv="refresh" th:attr="content='0;url=' + ${authorizationUrl}">
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <style>body{background:#f4f6f9;font-family:sans-serif}.box{max-width:460px;margin:80px auto;text-align:center}</style>
</head>
<body>
    <div class="box">
        <div class="spinner-border text-primary mb-3" role="status"></div>
        <h5>Taking you to Paystack secure checkout…</h5>
        <p class="text-muted">If nothing happens, <a th:href="${authorizationUrl}">click here to continue</a>.</p>
    </div>
    <script th:inline="javascript">
        var url = /*[[${authorizationUrl}]]*/ '';
        if (url) { window.location.replace(url); }
    </script>
</body>
</html>

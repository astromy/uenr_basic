<div th:fragment="StudentList" class="jumbotron bg-white shadow">
    <a th:href="@{/DownloadStudentExcelSheet/{ClassId} (ClassId=${classId})}" class="btn btn-primary">
        Download Student File
    </a>  
    <a th:href="@{/StoppedStudentlist/{classId} (ClassId=${classId})}" class="btn btn-primary">
        All Stopped Students
    </a> 

    <table class="table table-striped table-responsive-md table-primary shadow" id="mydata">
        <thead>
            <tr>
                <th>Student Id</th>
                <th>First Name</th>
                <th>Other  Name</th>
                <th>Sur Name</th>
                <th></th>
                <th></th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="student:${StudentList}">    
                <td th:text="${student.StudentId}"></td>
                <td th:text="${student.FirstName}"></td>
                <td th:text="${student.LastName}"></td>
                <td th:text="${student.surname}"></td>
                <TD>   <img th:src="@{${student.studentPicture}}" class=" img-thumbnail img-fluid "/></td>

                <td><a th:href="@{/StudentDetails/{id}(id=${student.StudentId})}" class="btn btn-primary ">Details</a></td>
                <td><a class="btn btn-primary "
                       th:href="@{/FlagStudent/{studentId}/{classId}(studentId=${student.StudentId},classId=${classId})}"
                       > Stopped </a></td>


            </tr>

            <!-- payment form -->

        </tbody>
    </table>

</div>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>SMS - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap core CSS -->
    <link th:href="@{/css/bootstrap.min.css}" th:rel="stylesheet">

    <!-- Login page CSS -->
    <link th:href="@{/css/login.css}" th:rel="stylesheet">

    <link th:href="@{/css/fontawesome.css}" rel="stylesheet" type="text/css"/>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <!-- Header with logo -->
            <div class="login-header">
                <img th:src="@{/pro-pics/UENR.PNG}" height="100" alt="School Logo"/>
                <h1>SMS</h1>
            </div>

            <!-- Login Form -->
            <div class="login-body">
                <form th:method="post" th:action="@{/login}" id="loginForm">
                    <!-- Error message -->
                    <div th:if="${param.error}">
                        <p class="alert alert-warning">[[${session.SPRING_SECURITY_LAST_EXCEPTION.message}]]</p>
                    </div>

                    <!-- Logout message -->
                    <div th:if="${param.logout}">
                        <p class="alert alert-success text-center">You have been logged out. Try logging in again.</p>
                    </div>

                    <!-- Sign In label -->
                    <label for="username" class="h6 mb-3">Please Sign In</label>

                    <!-- Username field -->
                    <div class="form-group mb-3">
                        <label for="username">User Name (ID)</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required autofocus>
                    </div>

                    <!-- Password field -->
                    <div class="form-group mb-4">
                        <label for="password">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                    </div>

                    <!-- Submit button with loading state -->
                    <div class="form-group mb-3">
                        <input type="submit" value="Login" class="btn btn-login" id="upload_btn" th:onclick="spinOnload()">
                        <button class="btn btn-login d-none" id="loading_btn" type="button" disabled>
                            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                            Please wait...
                        </button>
                    </div>

                    <!-- Forgot password link -->
                    <div class="text-center">
                        <a th:href="@{/reset}" class="forgot-password">Forgot password?</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script th:src="@{/script/jquery.min.js}"></script>
    <script th:src="@{/script/bootstrap.min.js}" type="text/javascript"></script>
    <script th:src="@{/script/ProgressDialog_1.js}" type="text/javascript"></script>
</body>
</html>

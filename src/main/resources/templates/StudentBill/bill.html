                </div>

                        </div>
                        <div class="form-group col-8" style="margin-top:5px; ">

                        </button>
                    </form>
                </center>

            </div>

 
<div th:fragment="payments">

                                    <tr>
                                       <th>Term</th><th>Fee GHC:</th><th>Description</th>
                                       
                                       
                
                                   </tr>
                               </thead>

                                       <td th:text="${STP.term.academicyear.AcademicYear.getYear()}"></td>
                                      
                                   </tr>

                                       <th>Total: (GHC) </th><th th:text="${TotalPayments }"></th>
                                       <th> </th><th>  </th>
                                       <th></th><th></th><th></th><th></th>
                                   </tr>
                                  
                               </tbody>
                           </table>
                        
                        
                        
                            </div>
                        
                    </div>
                
                
                
                
                
                
        </div>

<div th:fragment="ExcelUploadBills">

 <div th:if="${StudentBills}" class="col-md-8 card">
                            <table class="table table-striped table-bordered table-primary " id="mydata">
                                <thead>
                                    <tr>
                                        <th>Student Id</th>
                                        <th>Student Name</th>
                                        <th>Out Standing Balance </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="studentBil:${StudentBills}">
                                        <td th:text="${studentBil.studentId}"> </td>
                                        <td th:text="${studentBil.Names}"> </td>
                                        <td th:text="${studentBil.OutstandingBalace}"> </td> 
                                    </tr>


                                </tbody>
                            </table>

                        </div>

</div>
 <div th:if="${StudentBills}" class="col-md-8 jumbotron" id="ExcelForm">
                            <button onClick="saveBill();" class="btn btn-success" style="margin-bottom: 20px;">SaveData</button>
                            <table class="table table-striped table-bordered table-primary " id="mydata">
                                <thead>
                                    <tr>
                                        <th>Student Id</th>
                                        <th>Student Name</th>
                                        <th>Out Standing Balance </th>

                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="studentBil:${StudentBills}">
                                        <td th:text="${studentBil.studentId}"> </td>
                                        <td th:text="${studentBil.Names}"> </td>
                                        <td th:text="${studentBil.OutstandingBalace}"> </td> 
                                    </tr>


                                </tbody>
                            </table><script>
                                function saveBill() {
                                         
                                    $.ajax({
                                    url: "/saveExcelBill",
                                            type:"GET",
                                            dataType: 'JSON',
                                            success:function(data){
                                                Alert(data);
                                                 document.getElementById("ExcelForm").classList.add("d-none");


                                            }});
                                    }
                            </script>
                        </div>

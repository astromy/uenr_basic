<div th:fragment="editExpense">

    <div class="bg-warning text-dark h5" style="margin-top:30px;">
        <label>Edit Expense</label>
    </div>

    <div class="card border-0 shadow-sm rounded-lg" style="margin-top:20px; max-width: 800px;">

        <div class="card-header bg-white py-3">
            <h6 class="text-primary mb-0">Update Expense Details</h6>
        </div>

        <div class="card-body">
            <form th:method="post" th:action="@{/FinancePortal/expenses/update}" th:object="${expense}" class="needs-validation" novalidate>

                <input type="hidden" th:field="*{Id}">

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="expenseDate" class="form-label">Expense Date <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="expenseDate" th:field="*{ExpenseDate}" required>
                        <div class="invalid-feedback">Please select a date.</div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="amount" class="form-label">Amount (GHC) <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" class="form-control" id="amount" th:field="*{Amount}" placeholder="0.00" required>
                        <div class="invalid-feedback">Please enter an amount.</div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="category" class="form-label">Category <span class="text-danger">*</span></label>
                        <select class="form-control" id="category" th:field="*{category}" required>
                            <option value="">-- Select Category --</option>
                            <option value="SALARIES">Salaries</option>
                            <option value="UTILITIES">Utilities</option>
                            <option value="SUPPLIES">Supplies</option>
                            <option value="MAINTENANCE">Maintenance</option>
                            <option value="TRANSPORT">Transport</option>
                            <option value="FOOD">Food/Catering</option>
                            <option value="FUEL">Fuel</option>
                            <option value="REPAIRS">Repairs</option>
                            <option value="OTHER">Other</option>
                        </select>
                        <div class="invalid-feedback">Please select a category.</div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="paymentMethod" class="form-label">Payment Method <span class="text-danger">*</span></label>
                        <select class="form-control" id="paymentMethod" th:field="*{paymentMethod}" required>
                            <option value="">-- Select Payment Method --</option>
                            <option value="CASH">Cash</option>
                            <option value="BANK_TRANSFER">Bank Transfer</option>
                            <option value="MOBILE_MONEY">Mobile Money</option>
                            <option value="CHEQUE">Cheque</option>
                        </select>
                        <div class="invalid-feedback">Please select a payment method.</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Description <span class="text-danger">*</span></label>
                    <textarea class="form-control" id="description" th:field="*{description}" rows="3" placeholder="Enter expense description..." required></textarea>
                    <div class="invalid-feedback">Please enter a description.</div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="referenceNumber" class="form-label">Reference Number</label>
                        <input type="text" class="form-control" id="referenceNumber" th:field="*{referenceNumber}" placeholder="e.g., REC-001">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="status" class="form-label">Status</label>
                        <select class="form-control" id="status" th:field="*{status}">
                            <option value="PENDING">Pending</option>
                            <option value="PAID">Paid</option>
                            <option value="CANCELLED">Cancelled</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="term" class="form-label">Term</label>
                        <select class="form-control" id="term" th:field="*{term}">
                            <option value="">-- Select Term --</option>
                            <option th:each="t:${terms}" th:value="${t.id}" th:text="${t.TermName}"></option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="academicYear" class="form-label">Academic Year</label>
                        <select class="form-control" id="academicYear" th:field="*{academicYear}">
                            <option value="">-- Select Academic Year --</option>
                            <option th:each="a:${academicYears}" th:value="${a.id}" th:text="${a.AcademicYear.getYear()}"></option>
                        </select>
                    </div>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                    <a th:href="@{/FinancePortal/expenses/list}" class="btn btn-secondary me-md-2">Cancel</a>
                    <button type="submit" class="btn btn-warning" id="upload_btn" th:onclick="spinOnload()">
                        Update Expense
                    </button>
                    <button class="btn btn-primary d-none" id="loading_btn" type="button">
                        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                        Updating.................
                    </button>
                </div>

            </form>
        </div>
    </div>

</div>

<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml">
<div th:fragment="expensesList">

    <div class="bg-info text-white h5" style="margin-top:30px;">
        <label>Manage Expenses</label>
    </div>

    <div class="card border-0 shadow-sm rounded-lg" style="margin-top:20px;">

        <div class="card-header bg-white py-3">
            <div class="row align-items-center">
                <div class="col">
                    <h6 class="text-primary mb-0">All Expenses</h6>
                </div>
                <div class="col text-end">
                    <button type="button"
                            class="btn btn-primary btn-sm"
                            onclick="openExpenseModal()">
                        <i class="bi bi-plus-circle"></i> Add New Expense
                    </button>
                </div>
            </div>
        </div>

        <div class="card-body">

            <!-- Filter bar -->
            <form th:action="@{/FinancePortal/expenses/list}" method="get"
                  class="row g-2 mb-3" id="expenseFilterForm">

                <div class="col-md-3">
                    <input type="text" name="search" class="form-control"
                           placeholder="Search description / reference"
                           th:value="${filter != null} ? ${filter.search()} : ''">
                </div>

                <div class="col-md-2">
                    <select name="category" class="form-select">
                        <option value="">All categories</option>
                        <option th:each="c : ${categories}"
                                th:value="${c.code()}"
                                th:text="${c.display}"
                                th:selected="${filter != null and filter.category() == c.code()}">
                        </option>
                    </select>
                </div>

                <div class="col-md-2">
                    <select name="status" class="form-select">
                        <option value="">All statuses</option>
                        <option th:each="s : ${statuses}"
                                th:value="${s.code()}"
                                th:text="${s.display}"
                                th:selected="${filter != null and filter.status() == s.code()}">
                        </option>
                    </select>
                </div>

                <div class="col-md-2">
                    <input type="date" name="from" class="form-control"
                           th:value="${filter != null and filter.from() != null}
                               ? ${#temporals.format(filter.from(), 'yyyy-MM-dd')} : ''">
                </div>

                <div class="col-md-2">
                    <input type="date" name="to" class="form-control"
                           th:value="${filter != null and filter.to() != null}
                               ? ${#temporals.format(filter.to(), 'yyyy-MM-dd')} : ''">
                </div>

                <div class="col-md-1 d-grid">
                    <button type="submit" class="btn btn-outline-primary">
                        <i class="bi bi-funnel"></i> Filter
                    </button>
                </div>
            </form>

            <div class="table-responsive">

                <table class="table table-hover mb-0" id="expensesTable">
                    <thead>
                    <tr>
                        <th>Date</th>
                        <th>Category</th>
                        <th>Description</th>
                        <th class="text-end">Amount (GHC)</th>
                        <th>Payment Method</th>
                        <th>Reference</th>
                        <th>Status</th>
                        <th>Term</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody id="expensesTbody">
                    <tr th:each="expense : ${expensesPage != null ? expensesPage.content : null}">
                        <td th:text="${expense.expenseDate != null}
                            ? ${#temporals.format(expense.expenseDate, 'dd/MM/yyyy')}
                            : 'N/A'"></td>
                        <td th:text="${expense.category}"></td>
                        <td th:text="${expense.description}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(expense.amount, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td th:text="${expense.paymentMethod}"></td>
                        <td th:text="${expense.referenceNumber}"></td>
                        <td>
                            <span th:class="'badge ' +
                                (expense.status == 'PAID' ? 'bg-success'
                                : (expense.status == 'CANCELLED' ? 'bg-secondary' : 'bg-warning'))"
                                  th:text="${expense.status}"></span>
                        </td>
                        <td th:text="${expense.termName != null ? expense.termName : 'N/A'}"></td>
                        <td>
                            <button type="button"
                                    class="btn btn-sm btn-outline-primary"
                                    th:onclick="|openExpenseModal(${expense.id})|">
                                <i class="bi bi-pencil"></i> Edit
                            </button>
                            <button type="button"
                                    class="btn btn-sm btn-outline-danger"
                                    th:onclick="|deleteExpense(${expense.id})|">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </td>
                    </tr>

                    <tr th:if="${expensesPage == null or expensesPage.content.isEmpty()}">
                        <td colspan="9" class="text-center text-muted py-4">
                            No expenses found.
                            Click "Add New Expense" to create one.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="d-flex justify-content-between align-items-center mt-4"
                 th:if="${expensesPage != null and expensesPage.totalPages > 0}">

                <div class="text-muted small">
                    Showing
                    <span th:text="${expensesPage.number * expensesPage.size + 1}"></span>
                    -
                    <span th:text="${T(java.lang.Math).min(
                        (expensesPage.number + 1) * expensesPage.size,
                        expensesPage.totalElements)}"></span>
                    of
                    <span th:text="${expensesPage.totalElements}"></span>
                    expenses
                </div>

                <nav aria-label="Expenses pagination">
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item"
                            th:classappend="${expensesPage.first ? 'disabled' : ''}">
                            <a class="page-link"
                               th:href="@{/FinancePortal/expenses/list(
                                   page=${expensesPage.number - 1},
                                   size=${expensesPage.size},
                                   search=${filter != null ? filter.search() : null},
                                   category=${filter != null ? filter.category() : null},
                                   status=${filter != null ? filter.status() : null},
                                   from=${filter != null and filter.from() != null
                                       ? #temporals.format(filter.from(), 'yyyy-MM-dd') : null},
                                   to=${filter != null and filter.to() != null
                                       ? #temporals.format(filter.to(), 'yyyy-MM-dd') : null})}">
                                Previous
                            </a>
                        </li>

                        <li class="page-item"
                            th:each="pageNumber : ${#numbers.sequence(0, expensesPage.totalPages - 1)}"
                            th:classappend="${pageNumber == expensesPage.number ? 'active' : ''}">
                            <a class="page-link"
                               th:href="@{/FinancePortal/expenses/list(
                                   page=${pageNumber},
                                   size=${expensesPage.size},
                                   search=${filter != null ? filter.search() : null},
                                   category=${filter != null ? filter.category() : null},
                                   status=${filter != null ? filter.status() : null},
                                   from=${filter != null and filter.from() != null
                                       ? #temporals.format(filter.from(), 'yyyy-MM-dd') : null},
                                   to=${filter != null and filter.to() != null
                                       ? #temporals.format(filter.to(), 'yyyy-MM-dd') : null})}"
                               th:text="${pageNumber + 1}">
                            </a>
                        </li>

                        <li class="page-item"
                            th:classappend="${expensesPage.last ? 'disabled' : ''}">
                            <a class="page-link"
                               th:href="@{/FinancePortal/expenses/list(
                                   page=${expensesPage.number + 1},
                                   size=${expensesPage.size},
                                   search=${filter != null ? filter.search() : null},
                                   category=${filter != null ? filter.category() : null},
                                   status=${filter != null ? filter.status() : null},
                                   from=${filter != null and filter.from() != null
                                       ? #temporals.format(filter.from(), 'yyyy-MM-dd') : null},
                                   to=${filter != null and filter.to() != null
                                       ? #temporals.format(filter.to(), 'yyyy-MM-dd') : null})}">
                                Next
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- Add / Edit Modal -->
    <div class="modal fade" id="expenseModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="expenseModalTitle">Add Expense</h5>
                    <button type="button" class="btn-close btn-close-white"
                            data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <form id="expenseForm">
                    <div class="modal-body">
                        <input type="hidden" id="expenseId" name="id">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Expense Date <span class="text-danger">*</span></label>
                                <input type="date" id="expenseDate" name="expenseDate"
                                       class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Amount (GHC) <span class="text-danger">*</span></label>
                                <input type="number" id="amount" name="amount"
                                       class="form-control" min="0" step="0.01" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Category <span class="text-danger">*</span></label>
                                <select id="category" name="category" class="form-select" required>
                                    <option value="">-- Select Category --</option>
                                    <option th:each="c : ${categories}"
                                            th:value="${c.code()}"
                                            th:text="${c.display}"></option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Payment Method <span class="text-danger">*</span></label>
                                <select id="paymentMethod" name="paymentMethod" class="form-select" required>
                                    <option value="">-- Select Payment Method --</option>
                                    <option value="CASH">Cash</option>
                                    <option value="BANK_TRANSFER">Bank Transfer</option>
                                    <option value="MOBILE_MONEY">Mobile Money</option>
                                    <option value="CHEQUE">Cheque</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description <span class="text-danger">*</span></label>
                            <textarea id="description" name="description" class="form-control"
                                      rows="3" required></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Reference Number</label>
                                <input type="text" id="referenceNumber" name="referenceNumber"
                                       class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Status</label>
                                <select id="status" name="status" class="form-select">
                                    <option th:each="s : ${statuses}"
                                            th:value="${s.code()}"
                                            th:text="${s.display}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Term</label>
                                <select id="termId" name="termId" class="form-select">
                                    <option value="">-- Select Term --</option>
                                    <option th:each="t : ${terms}"
                                            th:value="${t.id}"
                                            th:text="${t.TermName}"></option>
                                </select>
                            </div>
                        </div>

                        <div id="expenseFormError" class="alert alert-danger d-none"></div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary"
                                data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="expenseSaveBtn">
                            <i class="bi bi-check-circle me-1"></i> Save
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <script>
        (function () {
            const modalEl = document.getElementById('expenseModal');
            const modal = modalEl ? new bootstrap.Modal(modalEl) : null;
            const form = document.getElementById('expenseForm');
            const errorBox = document.getElementById('expenseFormError');

            window.openExpenseModal = function (id) {
                errorBox.classList.add('d-none');
                errorBox.textContent = '';
                form.reset();
                document.getElementById('expenseId').value = '';
                document.getElementById('expenseModalTitle').textContent = 'Add Expense';

                if (id) {
                    document.getElementById('expenseModalTitle').textContent = 'Edit Expense';
                    fetch('/FinancePortal/expenses/api/' + id)
                        .then(r => r.ok ? r.json() : Promise.reject('Not found'))
                        .then(data => {
                            document.getElementById('expenseId').value = data.id || '';
                            document.getElementById('expenseDate').value = data.expenseDate || '';
                            document.getElementById('amount').value = data.amount || 0;
                            document.getElementById('category').value = data.category || '';
                            document.getElementById('paymentMethod').value = data.paymentMethod || '';
                            document.getElementById('description').value = data.description || '';
                            document.getElementById('referenceNumber').value = data.referenceNumber || '';
                            document.getElementById('status').value = data.status || 'PENDING';
                            document.getElementById('termId').value = data.termId || '';
                        })
                        .catch(err => {
                            errorBox.classList.remove('d-none');
                            errorBox.textContent = 'Failed to load expense: ' + err;
                        });
                }
                modal && modal.show();
            };

            window.deleteExpense = function (id) {
                if (!confirm('Are you sure you want to delete this expense?')) return;
                fetch('/FinancePortal/expenses/api/delete/' + id, {method: 'POST'})
                    .then(r => r.json())
                    .then(data => {
                        alert(data.message || (data.success ? 'Deleted' : 'Failed'));
                        if (data.success) location.reload();
                    })
                    .catch(err => alert('Error: ' + err));
            };

            if (form) {
                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    errorBox.classList.add('d-none');
                    const id = document.getElementById('expenseId').value;
                    const url = id
                        ? '/FinancePortal/expenses/api/update'
                        : '/FinancePortal/expenses/api/save';
                    const payload = {
                        id: id || null,
                        expenseDate: document.getElementById('expenseDate').value || null,
                        amount: parseFloat(document.getElementById('amount').value) || 0,
                        category: document.getElementById('category').value,
                        paymentMethod: document.getElementById('paymentMethod').value,
                        description: document.getElementById('description').value,
                        referenceNumber: document.getElementById('referenceNumber').value,
                        status: document.getElementById('status').value || 'PENDING',
                        termId: document.getElementById('termId').value || null
                    };
                    fetch(url, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(payload)
                    })
                        .then(r => r.json())
                        .then(data => {
                            if (data.success) {
                                modal && modal.hide();
                                location.reload();
                            } else {
                                errorBox.classList.remove('d-none');
                                errorBox.textContent = data.message || 'Save failed';
                            }
                        })
                        .catch(err => {
                            errorBox.classList.remove('d-none');
                            errorBox.textContent = 'Error: ' + err;
                        });
                });
            }
        })();
    </script>
</div>
</html>

<html>
<div th:fragment="addExpense"
     xmlns:th="http://www.thymeleaf.org">

    <div class="card border-0 shadow-sm rounded-lg"
         style="margin-top:20px; max-width:800px;">

        <!-- Header -->
        <div class="card-header bg-white py-3">
            <h6 class="text-primary mb-0">Expense Details</h6>
        </div>

        <div class="card-body">

            <form th:action="@{/FinancePortal/expenses/save}"
                  th:object="${expense}"
                  method="post"
                  id="expenseForm">

                <!-- Expense Date & Amount -->
                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label for="expenseDate" class="form-label">
                            Expense Date
                            <span class="text-danger">*</span>
                        </label>

                        <input type="date"
                               class="form-control"
                               id="expenseDate"
                               th:field="*{ExpenseDate}"
                               required>

                        <div class="invalid-feedback">
                            Please select a date.
                        </div>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label for="amount" class="form-label">
                            Expense Amount (GHC)
                            <span class="text-danger">*</span>
                        </label>

                        <input type="number"
                               class="form-control"
                               id="expenseAmount"
                               th:field="*{Amount}"
                               placeholder="0.00"
                               min="0"
                               step="0.01"
                               required>

                        <div class="invalid-feedback">
                            Please enter an amount.
                        </div>

                    </div>

                </div>


                <!-- Category & Payment Method -->
                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label for="category" class="form-label">
                            Category
                            <span class="text-danger">*</span>
                        </label>

                        <select class="form-select"
                                id="category"
                                th:field="*{category}"
                                required>

                            <option value="">
                                -- Select Category --
                            </option>

                            <option value="SALARIES">Salaries</option>
                            <option value="UTILITIES">Utilities</option>
                            <option value="SUPPLIES">Supplies</option>
                            <option value="MAINTENANCE">Maintenance</option>
                            <option value="TRANSPORT">Transport</option>
                            <option value="FOOD">Food/Catering</option>
                            <option value="FUEL">Fuel</option>
                            <option value="REPAIRS">Repairs</option>
                            <option value="OTHER">Other</option>

                        </select>

                        <div class="invalid-feedback">
                            Please select a category.
                        </div>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label for="paymentMethod" class="form-label">
                            Payment Method
                            <span class="text-danger">*</span>
                        </label>

                        <select class="form-select"
                                id="paymentMethod"
                                th:field="*{paymentMethod}"
                                required>

                            <option value="">
                                -- Select Payment Method --
                            </option>

                            <option value="CASH">Cash</option>
                            <option value="BANK_TRANSFER">
                                Bank Transfer
                            </option>
                            <option value="MOBILE_MONEY">
                                Mobile Money
                            </option>
                            <option value="CHEQUE">Cheque</option>

                        </select>

                        <div class="invalid-feedback">
                            Please select a payment method.
                        </div>

                    </div>

                </div>


                <!-- Description -->
                <div class="mb-3">

                    <label for="description" class="form-label">
                        Description
                        <span class="text-danger">*</span>
                    </label>

                    <textarea class="form-control"
                              id="description"
                              th:field="*{description}"
                              rows="3"
                              placeholder="Enter expense description..."
                              required></textarea>

                    <div class="invalid-feedback">
                        Please enter a description.
                    </div>

                </div>


                <!-- Reference Number & Status -->
                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label for="referenceNumber" class="form-label">
                            Reference Number
                        </label>

                        <input type="text"
                               class="form-control"
                               id="referenceNumber"
                               th:field="*{referenceNumber}"
                               placeholder="e.g. REC-001">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label for="status" class="form-label">
                            Status
                        </label>

                        <select class="form-select"
                                id="status"
                                th:field="*{status}">

                            <option value="PENDING">
                                Pending
                            </option>

                            <option value="PAID">
                                Paid
                            </option>

                            <option value="CANCELLED">
                                Cancelled
                            </option>

                        </select>

                    </div>

                </div>


                <!-- Term -->
                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label for="term" class="form-label">
                            Term
                        </label>

                        <!--
                            IMPORTANT:
                            The controller expects termId,
                            not term.
                        -->
                        <select class="form-select"
                                id="term"
                                name="termId">

                            <option value="">
                                -- Select Term --
                            </option>

                            <option th:each="t : ${terms}"
                                    th:value="${t.id}"
                                    th:text="${t.TermName}">
                            </option>

                        </select>

                    </div>

                </div>


                <!-- Buttons -->
                <div class="d-flex justify-content-end mt-4">

                    <a th:href="@{/FinancePortal/expenses/list}"
                       class="btn btn-secondary me-2">

                        Cancel

                    </a>


                    <button type="submit"
                            class="btn btn-success"
                            id="upload_btn">

                        <i class="bi bi-check-circle me-1"></i>
                        Save Expense

                    </button>


                    <button type="button"
                            class="btn btn-primary d-none"
                            id="loading_btn"
                            disabled>

                        <span class="spinner-border spinner-border-sm me-1"
                              role="status"
                              aria-hidden="true">
                        </span>

                        Saving...

                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- Submit / Loading Script -->
    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const form = document.getElementById("expenseForm");
            const uploadButton = document.getElementById("upload_btn");
            const loadingButton = document.getElementById("loading_btn");

            if (form) {

                form.addEventListener("submit", function () {

                    uploadButton.classList.add("d-none");
                    loadingButton.classList.remove("d-none");

                });

            }

        });

    </script>

</div>
